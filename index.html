<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع أنوار القرآن</title>
    <style>

        h1 { color: #2c3e50; }
        .section { margin: 20px 0; padding: 10px; border-bottom: 1px solid #eee; }
    </style>

    <div class="container">
        <h1>مشروع أنوار القرآن</h1>
        <p>بقلم أحمد الطرشاني</p>
        
        <div class="section">
            <h3>تدبر الآيات الكريمة</h3>
            <p>تدبر الآيات الكريمة، سؤال الناس بما تمس المؤسسة والقدرات الكريمة.</p>
        </div>
        
        <div class="section">
            <h3>ترجمة المعاني</h3>
            <p>اللغة العربية، الإنجليزية، الفرنسية.</p>
        </div>
    </div>
</body>
</html>
