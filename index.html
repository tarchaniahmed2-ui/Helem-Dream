<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع أنوار القرآن - Helem-Dream</title>
    <!-- وسم Viewport لجعل الصفحة متجاوبة كأنها تطبيق على الهاتف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* تنسيق عام للصفحة */
        body { font-family: 'Amiri', 'Traditional Arabic', serif; text-align: center; background-color: #f9f9f9; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        /* تنسيق صندوق الآية والتدبر */
        .verse-box { background: white; padding: 25px; border-radius: 15px; margin: 25px 0; border: 1px solid #ddd; position: relative; }
        .verse-title { font-size: 1.4em; color: #2c3e50; font-weight: bold; margin-top: 0; }
        .verse-text { font-size: 1.8em; font-weight: bold; margin-bottom: 20px; line-height: 1.6; }
        
        /* تنسيق حاوية صور الزليج */
        .zellige-visuals { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 600px; margin: auto; padding-top: 20px; }
        .zellige-item { position: relative; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid #ddd; }
        .zellige-item img { width: 100%; height: auto; display: block; border-radius: 13px; }
        
        /* تنسيق التسمية على الصورة (ID Overlay) */
        .zellige-id-overlay { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; border-radius: 5px; font-size: 12px; font-family: sans-serif; }
        
        /* تنسيقات أخرى للعناوين والنصوص */
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #555; }
    </style>
    <!-- استدعاء خط 'Amiri' ليعطي طابعاً تراثياً أنيقاً -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>مشروع أنوار القرآن</h1>
        <p>بقلم: أحمد الطرشاني</p>

        <!-- صندوق الآية 11 -->
        <div class="verse-box">
            <div class="verse-title">سورة البقرة - الآية 11</div>
            <p class="verse-text">"وَإِذَا قِيلَ لَهُمْ لَا تُفْسِدُوا فِي الْأَرْضِ قَالُوا إِنَّمَا نَحْنُ مُصْلِحُونَ"</p>
        </div>

        <!-- حاوية الصور الرقمية -->
        <div class="zellige-visuals">
            <!-- الصورة الأولى (جزء مليار و 700) -->
            <div class="zellige-item" style="border-color: #3498db;">
                <img src="https://images.iahmed2-ui.github.io/zellige/visual_1700.jpg" alt="صرح الزليج الرقمي - جزء 1">
                <div class="zellige-id-overlay">ID: 1700-ZEL</div>
            </div>

            <!-- الصورة الثانية -->
            <div class="zellige-item">
                <img src="https://images.iahmed2-ui.github.io/zellige/visual_1701.jpg" alt="صرح الزليج الرقمي - جزء 2">
            </div>

            <!-- الصورة الثالثة -->
            <div class="zellige-item">
                <img src="https://images.iahmed2-ui.github.io/zellige/visual_1702.jpg" alt="صرح الزليج الرقمي - جزء 3">
            </div>

            <!-- الصورة الرابعة -->
            <div class="zellige-item">
                <img src="https://images.iahmed2-ui.github.io/zellige/visual_1703.jpg" alt="صرح الزليج الرقمي - جزء 4">
            </div>

            <!-- الصورة الخامسة -->
            <div class="zellige-item">
                <img src="https://images.iahmed2-ui.github.io/zellige/visual_1704.jpg" alt="صرح الزليج الرقمي - جزء 5">
            </div>
        </div>

        <!-- تذييل الصفحة -->
        <div style="margin-top: 40px; text-align: center; color: #7f8c8d; font-size: 0.9em;">
            &copy; 2026 مشروع أنوار القرآن - Helem-Dream. جميع الحقوق محفوظة.
        </div>
    </div>
</body>
</html>
